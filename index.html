<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nova | Login</title>
    <style>
      :root {
        --bg: #07111f;
        --bg-soft: #0f1c2d;
        --panel: rgba(15, 23, 42, 0.9);
        --panel-light: #f8fafc;
        --text: #e2e8f0;
        --muted: #9fb3c8;
        --primary: #6ee7b7;
        --primary-strong: #34d399;
        --accent: #7c3aed;
        --border: rgba(148, 163, 184, 0.18);
        --input: rgba(148, 163, 184, 0.08);
        --shadow: 0 24px 60px rgba(15, 23, 42, 0.42);
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        font-family: Arial, Helvetica, sans-serif;
        background: radial-gradient(circle at top, #11213a 0%, var(--bg) 35%, #040b14 100%);
        color: var(--text);
        display: grid;
        place-items: center;
      }

      a {
        color: inherit;
        text-decoration: none;
      }

      .login-shell {
        width: min(1000px, calc(100% - 32px));
        min-height: 620px;
        display: grid;
        grid-template-columns: 1.1fr 0.9fr;
        background: rgba(10, 17, 28, 0.78);
        border: 1px solid var(--border);
        border-radius: 28px;
        overflow: hidden;
        box-shadow: var(--shadow);
        backdrop-filter: blur(8px);
      }

      .login-panel {
        padding: 52px 42px;
        background: rgba(7, 17, 31, 0.85);
      }

      .brand {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        font-size: 0.9rem;
        font-weight: 700;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--text);
      }

      .brand-mark {
        width: 12px;
        height: 12px;
        border-radius: 50%;
        background: linear-gradient(135deg, var(--primary), var(--accent));
        box-shadow: 0 0 18px rgba(110, 231, 183, 0.8);
      }

      .login-box {
        max-width: 420px;
        margin: 84px auto 0;
      }

      .login-box h1 {
        margin: 0;
        font-size: clamp(2.3rem, 4vw, 3.1rem);
        letter-spacing: -0.06em;
      }

      .login-box p {
        margin: 12px 0 28px;
        color: var(--muted);
      }

      .field {
        display: grid;
        gap: 8px;
        margin-bottom: 18px;
      }

      label {
        font-size: 0.9rem;
        color: var(--muted);
      }

      input {
        width: 100%;
        border: 1px solid var(--border);
        background: var(--input);
        color: var(--text);
        border-radius: 14px;
        padding: 15px 16px;
        font-size: 1rem;
        outline: none;
      }

      input:focus {
        border-color: rgba(110, 231, 183, 0.7);
        box-shadow: 0 0 0 3px rgba(110, 231, 183, 0.12);
      }

      .options {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 12px;
        margin: 10px 0 22px;
        color: var(--muted);
        font-size: 0.92rem;
      }

      .checkbox {
        display: inline-flex;
        align-items: center;
        gap: 8px;
      }

      .checkbox input {
        width: auto;
        accent-color: var(--primary-strong);
      }

      .link {
        color: var(--primary);
      }

      .btn {
        width: 100%;
        border: none;
        border-radius: 14px;
        padding: 16px 20px;
        font-size: 1rem;
        font-weight: 700;
        cursor: pointer;
        transition: transform 0.2s ease, opacity 0.2s ease;
      }

      .btn:hover {
        transform: translateY(-1px);
      }

      .primary {
        background: linear-gradient(135deg, var(--primary), var(--primary-strong));
        color: #041419;
        box-shadow: 0 16px 30px rgba(52, 211, 153, 0.28);
      }

      .alt-login {
        margin-top: 22px;
        display: grid;
        gap: 12px;
      }

      .alt-btn {
        background: rgba(15, 23, 42, 0.8);
        border: 1px solid var(--border);
        color: var(--text);
      }

      .signup {
        margin-top: 22px;
        text-align: center;
        font-size: 0.92rem;
        color: var(--muted);
      }

      .signup a {
        color: var(--primary);
        font-weight: 700;
      }

      .promo-panel {
        position: relative;
        background: linear-gradient(180deg, rgba(17, 33, 58, 0.9), rgba(10, 17, 28, 0.96));
        padding: 42px 34px;
        border-left: 1px solid var(--border);
        display: flex;
        align-items: center;
      }

      .promo-card {
        width: 100%;
        background: rgba(15, 23, 42, 0.8);
        border: 1px solid var(--border);
        border-radius: 24px;
        padding: 26px 22px;
      }

      .promo-label {
        display: inline-block;
        margin-bottom: 18px;
        padding: 8px 12px;
        border-radius: 999px;
        background: rgba(110, 231, 183, 0.1);
        border: 1px solid rgba(110, 231, 183, 0.2);
        color: var(--primary);
        font-size: 0.8rem;
        font-weight: 700;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      .promo-card h2 {
        margin: 0;
        font-size: clamp(2rem, 3vw, 2.6rem);
        letter-spacing: -0.05em;
      }

      .promo-card p {
        color: var(--muted);
        line-height: 1.7;
      }

      .stats {
        margin-top: 26px;
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 16px;
      }

      .stat {
        padding: 16px;
        border-radius: 16px;
        background: rgba(148, 163, 184, 0.05);
        border: 1px solid var(--border);
      }

      .stat strong {
        display: block;
        font-size: 1.45rem;
        margin-top: 8px;
      }

      @media (max-width: 820px) {
        .login-shell {
          grid-template-columns: 1fr;
        }

        .promo-panel {
          border-left: none;
          border-top: 1px solid var(--border);
          min-height: 260px;
        }
      }

      @media (max-width: 520px) {
        .login-panel {
          padding: 32px 22px;
        }

        .login-box {
          margin-top: 42px;
        }

        .options {
          flex-direction: column;
          align-items: flex-start;
        }

        .stats {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <div class="login-shell">
      <div class="login-panel">
        <div class="brand">
          <span class="brand-mark"></span>
          <span>Nova</span>
        </div>

        <div class="login-box">
          <h1>Welcome back</h1>
          <p>Log in to continue to your dashboard.</p>

          <form>
            <div class="field">
              <label for="email">Email address</label>
              <input id="email" type="email" placeholder="name@example.com" />
            </div>

            <div class="field">
              <label for="password">Password</label>
              <input id="password" type="password" placeholder="Enter your password" />
            </div>

            <div class="options">
              <label class="checkbox">
                <input type="checkbox" />
                <span>Remember me</span>
              </label>
              <a href="#" class="link">Forgot password?</a>
            </div>

            <button class="btn primary" type="submit">Log In</button>

            <div class="alt-login">
              <button class="btn alt-btn" type="button">Continue with Google</button>
              <button class="btn alt-btn" type="button">Continue with GitHub</button>
            </div>
          </form>

          <div class="signup">
            Don’t have an account? <a href="#">Sign up</a>
          </div>
        </div>
      </div>

      <div class="promo-panel">
        <div class="promo-card">
          <span class="promo-label">Productivity</span>
          <h2>Build momentum with less friction.</h2>
          <p>
            Manage projects, track growth, and keep your team aligned from one beautifully simple workspace.
          </p>

          <div class="stats">
            <div class="stat">
              <span>Active users</span>
              <strong>18k+</strong>
            </div>
            <div class="stat">
              <span>Uptime</span>
              <strong>99.9%</strong>
            </div>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
